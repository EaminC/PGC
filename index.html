<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGC · 角色选择</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef3f8, #dfe8f0);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        color: #37474f;
      }

      .container {
        max-width: 760px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 22px;
        padding: 32px 24px 28px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        text-align: center;
        margin: 0 0 4px;
        font-size: 24px;
        color: #37474f;
      }

      .subtitle {
        text-align: center;
        color: #78909c;
        font-size: 13px;
        margin-bottom: 18px;
      }

      /* === Yanzhi 老板条 === */
      .boss {
        display: flex;
        justify-content: center;
        margin-bottom: 22px;
      }

      .boss-card {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px 6px 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ffd6bd, #ffe5d0);
        color: #5d4037;
        font-weight: 700;
        font-size: 14px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      }

      .boss-card .badge {
        background: rgba(55, 71, 79, 0.85);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
      }

      /* === 角色网格 === */
      .chars {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 14px;
        max-width: 720px;
        margin: 0 auto;
      }

      .char-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 10px 14px;
        border-radius: 18px;
        background: #f5f7f9;
        text-decoration: none;
        color: #37474f;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .char-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        background: #ffffff;
      }

      .char-card:active {
        transform: translateY(-1px) scale(0.98);
      }

      .team-tag {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(55, 71, 79, 0.88);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        letter-spacing: 0.3px;
      }

      .char-svg {
        width: 80px;
        height: 96px;
        margin: 6px auto 8px;
        position: relative;
      }

      .char-name {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.2;
      }

      .char-role {
        font-size: 11px;
        color: #607d8b;
        font-weight: 500;
        margin-top: 2px;
        min-height: 14px;
      }

      /* === Mini 角色（与原版同款 div 拼法） === */
      .mini {
        position: absolute;
        inset: 0;
      }

      .mini .m-hair {
        position: absolute;
        z-index: 3;
      }
      .mini .m-face {
        position: absolute;
        width: 44px;
        height: 48px;
        background: #ffd6bd;
        border-radius: 48% 48% 45% 45%;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        z-index: 4;
      }
      .mini .m-eye {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #333;
        border-radius: 50%;
        top: 44px;
        z-index: 5;
      }
      .mini .m-eye.left {
        left: calc(50% - 10px);
      }
      .mini .m-eye.right {
        right: calc(50% - 10px);
      }
      .mini .m-mouth {
        position: absolute;
        width: 11px;
        height: 5px;
        border-bottom: 2px solid #a34c4c;
        border-radius: 0 0 50% 50%;
        left: 50%;
        top: 55px;
        transform: translateX(-50%);
        z-index: 5;
      }
      .mini .m-body {
        position: absolute;
        width: 56px;
        height: 40px;
        border-radius: 20px 20px 14px 14px;
        left: 50%;
        top: 70px;
        transform: translateX(-50%);
        z-index: 2;
      }

      /* ABB */
      .mini.abb .m-hair {
        width: 50px;
        height: 40px;
        background: #25252b;
        border-radius: 50% 50% 14px 14px;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
      }
      .mini.abb .m-hair::before,
      .mini.abb .m-hair::after {
        content: "";
        position: absolute;
        width: 11px;
        height: 20px;
        background: #25252b;
        bottom: -6px;
        border-radius: 0 0 8px 8px;
      }
      .mini.abb .m-hair::before {
        left: 0;
      }
      .mini.abb .m-hair::after {
        right: 0;
      }
      .mini.abb .m-body {
        background: #6b8fd6;
      }

      /* Eamin */
      .mini.eamin .m-hair {
        width: 50px;
        height: 16px;
        background: #1a1a1a;
        border-radius: 25px 25px 6px 6px;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }
      .mini.eamin .m-body {
        background: #455a64;
      }

      /* J */
      .mini.j .m-hair {
        width: 62px;
        height: 70px;
        background: #3a2418;
        border-radius: 31px 31px 14px 14px;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
      }
      .mini.j .m-hair::before,
      .mini.j .m-hair::after {
        content: "";
        position: absolute;
        width: 11px;
        height: 38px;
        background: #3a2418;
        bottom: -22px;
        border-radius: 0 0 10px 10px;
      }
      .mini.j .m-hair::before {
        left: 2px;
      }
      .mini.j .m-hair::after {
        right: 2px;
      }
      .mini.j .m-body {
        background: #f48fb1;
      }

      /* Andy */
      .mini.andy .m-hair {
        width: 52px;
        height: 38px;
        background: #6e4426;
        border-radius: 50% 50% 14px 14px;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
      }
      .mini.andy .m-hair::before,
      .mini.andy .m-hair::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 22px;
        background: #6e4426;
        bottom: -8px;
        border-radius: 0 0 8px 8px;
      }
      .mini.andy .m-hair::before {
        left: 0;
      }
      .mini.andy .m-hair::after {
        right: 0;
      }
      .mini.andy .m-body {
        background: #ffb74d;
      }

      /* 旺仔（Follow大头兵）*/
      .mini.wangzai .m-hair {
        width: 48px;
        height: 22px;
        background: #5a3a22;
        border-radius: 24px 24px 8px 8px;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
      }
      .mini.wangzai .m-hair::before {
        content: "";
        position: absolute;
        width: 4px;
        height: 22px;
        background: #5a3a22;
        bottom: -22px;
        left: 4px;
        border-radius: 0 0 4px 4px;
        z-index: 3;
      }
      .mini.wangzai .m-hair::after {
        content: "";
        position: absolute;
        width: 4px;
        height: 22px;
        background: #5a3a22;
        bottom: -22px;
        right: 4px;
        border-radius: 0 0 4px 4px;
        z-index: 3;
      }
      .mini.wangzai .m-body {
        background: #d96363;
      }

      /* === 移动端 === */
      @media (max-width: 480px) {
        body {
          padding: 14px;
        }
        .container {
          padding: 22px 16px 20px;
        }
        h1 {
          font-size: 22px;
        }
        .chars {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .char-card {
          padding: 14px 6px 12px;
        }
        .char-svg {
          width: 70px;
          height: 86px;
        }
        .char-name {
          font-size: 14px;
        }
        .team-tag {
          font-size: 9px;
          padding: 2px 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>PGC</h1>
      <div class="subtitle">选一个角色进入游戏</div>

      <div class="boss">
        <div class="boss-card">
          Yanzhi
          <span class="badge">待上线</span>
        </div>
      </div>

      <div class="chars">
        <!-- ABB → Follow -->
        <a class="char-card" href="Follow/test.html">
          <span class="team-tag">Follow</span>
          <div class="char-svg">
            <div class="mini abb">
              <div class="m-hair"></div>
              <div class="m-face"></div>
              <div class="m-eye left"></div>
              <div class="m-eye right"></div>
              <div class="m-mouth"></div>
              <div class="m-body"></div>
            </div>
          </div>
          <div class="char-name">ABB</div>
          <div class="char-role">&nbsp;</div>
        </a>

        <!-- Eamin → OGC -->
        <a class="char-card" href="OGC/index.html">
          <span class="team-tag">OGC</span>
          <div class="char-svg">
            <div class="mini eamin">
              <div class="m-hair"></div>
              <div class="m-face"></div>
              <div class="m-eye left"></div>
              <div class="m-eye right"></div>
              <div class="m-mouth"></div>
              <div class="m-body"></div>
            </div>
          </div>
          <div class="char-name">Eamin</div>
          <div class="char-role">影视大头兵</div>
        </a>

        <!-- J → OGC -->
        <a class="char-card" href="OGC/index.html">
          <span class="team-tag">OGC</span>
          <div class="char-svg">
            <div class="mini j">
              <div class="m-hair"></div>
              <div class="m-face"></div>
              <div class="m-eye left"></div>
              <div class="m-eye right"></div>
              <div class="m-mouth"></div>
              <div class="m-body"></div>
            </div>
          </div>
          <div class="char-name">J</div>
          <div class="char-role">热点大头兵</div>
        </a>

        <!-- Andy → OGC -->
        <a class="char-card" href="OGC/index.html">
          <span class="team-tag">OGC</span>
          <div class="char-svg">
            <div class="mini andy">
              <div class="m-hair"></div>
              <div class="m-face"></div>
              <div class="m-eye left"></div>
              <div class="m-eye right"></div>
              <div class="m-mouth"></div>
              <div class="m-body"></div>
            </div>
          </div>
          <div class="char-name">Andy</div>
          <div class="char-role">体育大头兵</div>
        </a>

        <!-- 旺仔 → Follow 号外小游戏 -->
        <a class="char-card" href="Follow/wangzai.html">
          <span class="team-tag">Follow</span>
          <div class="char-svg">
            <div class="mini wangzai">
              <div class="m-hair"></div>
              <div class="m-face"></div>
              <div class="m-eye left"></div>
              <div class="m-eye right"></div>
              <div class="m-mouth"></div>
              <div class="m-body"></div>
            </div>
          </div>
          <div class="char-name">旺仔</div>
          <div class="char-role">Follow大头兵</div>
        </a>
      </div>
    </div>
  </body>
</html>
