<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yanzhi 找你 1-1</title>
    <link rel="stylesheet" href="../assets/ogc.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff5f0, #ffe2d6);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        color: #4e342e;
      }

      .container {
        max-width: 760px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 22px;
        padding: 28px 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .back {
        text-decoration: none;
        color: #607d8b;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 10px;
        background: #eceff1;
        transition: background 0.15s;
      }
      .back:hover {
        background: #cfd8dc;
      }

      h1 {
        text-align: center;
        margin: 0 0 4px;
        font-size: 24px;
        color: #4e342e;
      }

      .subtitle {
        text-align: center;
        color: #8d6e63;
        font-size: 13px;
        margin-bottom: 22px;
      }

      /* === Yanzhi 头像 === */
      .stage {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding: 8px 0;
        min-height: 180px;
      }

      .yanzhi-char {
        position: relative;
        width: 110px;
        height: 150px;
      }

      .yanzhi-char .hair {
        position: absolute;
        width: 72px;
        height: 22px;
        background: #1a1a1a;
        border-radius: 36px 36px 6px 6px;
        top: 18px;
        left: 19px;
        z-index: 3;
      }
      .yanzhi-char .hair::before {
        content: "";
        position: absolute;
        width: 44px;
        height: 6px;
        background: #6a6a6a;
        border-radius: 3px;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
      }

      .yanzhi-char .face {
        position: absolute;
        width: 90px;
        height: 100px;
        background: #ffd6bd;
        border-radius: 48% 48% 45% 45%;
        left: 10px;
        top: 32px;
        z-index: 4;
      }

      .yanzhi-char .eye {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #333;
        border-radius: 50%;
        top: 30px;
      }
      .yanzhi-char .eye.left { left: 30px; }
      .yanzhi-char .eye.right { right: 30px; }

      .yanzhi-char .mouth {
        position: absolute;
        width: 18px;
        height: 7px;
        border-bottom: 2px solid #a34c4c;
        border-radius: 0 0 50% 50%;
        left: 50%;
        top: 56px;
        transform: translateX(-50%);
        z-index: 5;
      }

      .yanzhi-char .body {
        position: absolute;
        width: 110px;
        height: 78px;
        background: #37474f;
        border-radius: 30px 30px 22px 22px;
        left: 50%;
        top: 124px;
        transform: translateX(-50%);
        z-index: 2;
      }
      .yanzhi-char .body::before {
        content: "";
        position: absolute;
        width: 7px;
        height: 22px;
        background: #c62828;
        border-radius: 2px;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
      }

      /* === 输入区 === */
      .input-section {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 12px auto 0;
        max-width: 540px;
        padding: 14px 16px;
        background: #fff5f0;
        border-radius: 14px;
        border: 2px dashed #a1887f;
      }

      .input-section label {
        font-size: 14px;
        font-weight: 700;
        color: #4e342e;
        white-space: nowrap;
      }

      .input-section input {
        flex: 1;
        padding: 9px 12px;
        font-size: 14px;
        border: 1px solid #d7ccc8;
        border-radius: 8px;
        outline: none;
        background: #fff;
        transition: border-color 0.15s;
      }
      .input-section input:focus {
        border-color: #a1887f;
      }
      .input-section input:disabled {
        background: #eceff1;
        color: #90a4ae;
      }

      .input-section button {
        padding: 9px 20px;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: #a1887f;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .input-section button:hover:not(:disabled) {
        background: #6d4c41;
      }
      .input-section button:active:not(:disabled) {
        transform: scale(0.95);
      }
      .input-section button:disabled {
        background: #cfd8dc;
        cursor: not-allowed;
      }

      .hint {
        text-align: center;
        color: #a1887f;
        font-size: 12px;
        margin-top: 10px;
      }

      /* === 通话面板 === */
      .call-panel {
        margin-top: 22px;
        background: #fafafa;
        border-radius: 14px;
        padding: 16px;
        display: none;
      }
      .call-panel.show {
        display: block;
      }

      .call-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 12px;
        border-bottom: 1px dashed #d7ccc8;
        margin-bottom: 12px;
        font-size: 12px;
        color: #8d6e63;
      }
      .call-meta .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ef5350;
        animation: pulse-dot 1.5s ease-in-out infinite;
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .call-actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .call-actions button {
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #eceff1;
        color: #455a64;
        transition: background 0.15s;
      }
      .call-actions button:hover {
        background: #cfd8dc;
      }

      /* === 对话日志 === */
      .call-log {
        max-height: 380px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .call-log::-webkit-scrollbar {
        width: 6px;
      }
      .call-log::-webkit-scrollbar-thumb {
        background: #d7ccc8;
        border-radius: 3px;
      }

      .bubble-row {
        display: flex;
        margin-bottom: 10px;
        align-items: flex-start;
        gap: 8px;
      }
      .bubble-row.yanzhi {
        justify-content: flex-start;
      }

      .bubble-row .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #37474f;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }
      .bubble-row .avatar::before {
        content: "";
        position: absolute;
        width: 20px;
        height: 6px;
        background: #1a1a1a;
        border-radius: 10px 10px 2px 2px;
        top: 5px;
        left: 50%;
        transform: translateX(-50%);
      }
      .bubble-row .avatar::after {
        content: "";
        position: absolute;
        width: 4px;
        height: 8px;
        background: #c62828;
        border-radius: 1px;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
      }

      .bubble {
        position: static;
        transform: none;
        opacity: 1;
        pointer-events: auto;
        background: #fff8e1;
        border: 1px solid #c62828;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 14px;
        line-height: 1.6;
        color: #4e342e;
        max-width: calc(100% - 50px);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .bubble.intro {
        font-weight: 700;
        color: #b71c1c;
      }

      @media (max-width: 600px) {
        body { padding: 14px; }
        .container { padding: 22px 14px; }
        h1 { font-size: 20px; }
        .input-section {
          flex-wrap: wrap;
        }
        .input-section input {
          flex: 1 1 100%;
          order: 2;
        }
        .input-section button {
          order: 3;
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="back" href="yanzhi.html">← 返回 Yanzhi</a>
        <span style="font-size:11px;color:#a1887f">Follow · Yanzhi 找你 1-1</span>
      </div>

      <h1>📞 Yanzhi 找你 1-1</h1>
      <div class="subtitle">他会用一千字屁话糊你一脸</div>

      <div class="stage">
        <div class="yanzhi-char">
          <div class="hair"></div>
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
          </div>
          <div class="body"></div>
        </div>
      </div>

      <div class="input-section">
        <label for="topicInput">简短说一下</label>
        <input
          id="topicInput"
          type="text"
          placeholder="例如：转正 / KPI / 升职加薪"
          maxlength="20"
        />
        <button id="startBtn" type="button">开始 1-1</button>
      </div>
      <div class="hint">输入一个话题 → Yanzhi 会问候你 → 然后朗读一千字屁话</div>

      <div id="callPanel" class="call-panel">
        <div class="call-meta">
          <span class="dot"></span>
          <span>1-1 进行中 · Yanzhi 在说</span>
          <div class="call-actions">
            <button id="skipBtn" type="button">跳过朗读</button>
          </div>
        </div>
        <div id="callLog" class="call-log"></div>
      </div>
    </div>

    <script src="../assets/voices.js"></script>
    <script src="../assets/bullshit.js"></script>
    <script>
      const topicInput = document.getElementById("topicInput");
      const startBtn = document.getElementById("startBtn");
      const callPanel = document.getElementById("callPanel");
      const callLog = document.getElementById("callLog");
      const skipBtn = document.getElementById("skipBtn");

      let busy = false;

      function appendBubble(text, opts = {}) {
        const row = document.createElement("div");
        row.className = "bubble-row yanzhi";
        const av = document.createElement("div");
        av.className = "avatar";
        const b = document.createElement("div");
        b.className = "bubble" + (opts.intro ? " intro" : "");
        b.textContent = text;
        row.appendChild(av);
        row.appendChild(b);
        callLog.appendChild(row);
        callLog.scrollTop = callLog.scrollHeight;
      }

      function startOneOnOne() {
        if (busy) return;
        const topic = String(topicInput.value || "").trim();
        if (!topic) {
          topicInput.focus();
          topicInput.placeholder = "话题不能为空哦";
          return;
        }

        busy = true;
        startBtn.disabled = true;
        topicInput.disabled = true;
        callLog.innerHTML = "";
        callPanel.classList.add("show");

        if (window.OGCVoice) window.OGCVoice.clearSpeech();

        // 1) 引子
        const intro = `Eamin啊，我来找你简短地说一下${topic}的问题`;
        appendBubble(intro, { intro: true });
        if (window.OGCVoice) {
          window.OGCVoice.speak(intro, "yanzhi");
        }

        // 2) 等引子说完，开始屁话
        const introMs = Math.max(1200, intro.length * 280 + 400);
        setTimeout(() => {
          // 生成 ~1500 字屁话
          const article = Bullshit.generate(topic, 1500);
          appendBubble(article);

          // 快速朗读
          if (window.OGCVoice) {
            window.OGCVoice.queueSpeak(article, "yanzhi", {
              rate: 2.2,
              pitch: 0.65,
            });
          }
        }, introMs);

        // 估算屁话朗读时长（rate 2.2, ~280ms/字 / rate，加缓冲）
        const bsMs = Math.max(1500, Math.round((1500 * 280) / 2.2) + 800);
        const totalMs = introMs + bsMs;

        // 兜底：到时间后恢复按钮（即使 TTS onend 没触发）
        setTimeout(() => {
          busy = false;
          startBtn.disabled = false;
          topicInput.disabled = false;
          topicInput.value = "";
          topicInput.focus();
        }, totalMs + 500);
      }

      startBtn.addEventListener("click", startOneOnOne);
      topicInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          startOneOnOne();
        }
      });

      skipBtn.addEventListener("click", () => {
        if (window.OGCVoice) {
          window.OGCVoice.clearSpeech();
        }
        busy = false;
        startBtn.disabled = false;
        topicInput.disabled = false;
        topicInput.value = "";
        topicInput.focus();
      });

      topicInput.focus();
    </script>
  </body>
</html>
