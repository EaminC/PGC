<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>和 Yanzhi 打高尔夫</title>
    <link rel="stylesheet" href="../assets/ogc.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        color: #1b5e20;
      }

      .container {
        max-width: 880px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 22px;
        padding: 28px 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .back {
        text-decoration: none;
        color: #607d8b;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 10px;
        background: #eceff1;
        transition: background 0.15s;
      }
      .back:hover {
        background: #cfd8dc;
      }

      h1 {
        text-align: center;
        margin: 0 0 4px;
        font-size: 26px;
        color: #1b5e20;
      }

      .subtitle {
        text-align: center;
        color: #78909c;
        font-size: 13px;
        margin-bottom: 20px;
      }

      /* === 球场 === */
      .course {
        position: relative;
        background: linear-gradient(180deg, #a5d6a7, #66bb6a);
        border-radius: 16px;
        padding: 24px 16px 18px;
        margin-bottom: 20px;
        min-height: 220px;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.4);
      }

      .hole-flag {
        position: absolute;
        top: 14px;
        right: 22px;
        width: 4px;
        height: 36px;
        background: #fff;
        border-radius: 2px;
      }
      .hole-flag::after {
        content: "🚩";
        position: absolute;
        top: -16px;
        left: -8px;
        font-size: 18px;
      }

      /* === 球员 === */
      .players {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }

      .player {
        background: rgba(255, 255, 255, 0.85);
        border-radius: 14px;
        padding: 14px 8px 12px;
        text-align: center;
        position: relative;
        transition: transform 0.2s;
      }

      .player.swinging {
        animation: swing 0.5s ease;
      }
      .player.bogey {
        box-shadow: 0 0 0 2px #ef5350;
      }
      .player.birdie {
        box-shadow: 0 0 0 2px #43a047;
      }

      @keyframes swing {
        0%, 100% { transform: rotate(0); }
        25% { transform: rotate(-8deg) scale(1.05); }
        75% { transform: rotate(8deg) scale(1.05); }
      }

      .player .char-svg {
        width: 80px;
        height: 96px;
        margin: 0 auto 6px;
        position: relative;
      }

      .player .ch {
        position: absolute;
        inset: 0;
      }

      /* OGC 球员缩到 mini 尺寸 (复用 ogc.css 的 c- 名字) */
      .player .ch .c-face {
        width: 44px;
        height: 48px;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
      }
      .player .ch .c-eye {
        width: 4px;
        height: 4px;
        top: 44px;
      }
      .player .ch .c-eye.left {
        left: calc(50% - 10px);
      }
      .player .ch .c-eye.right {
        right: calc(50% - 10px);
      }
      .player .ch .c-mouth {
        width: 11px;
        height: 5px;
        top: 55px;
        left: 50%;
        transform: translateX(-50%);
      }
      .player .ch .c-body {
        width: 56px;
        height: 38px;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
      }

      /* 缩放各角色头发到 mini */
      .player .ch.eamin .c-hair {
        width: 50px;
        height: 16px;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }
      .player .ch.j .c-hair {
        width: 60px;
        height: 68px;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
      }
      .player .ch.j .c-hair::before,
      .player .ch.j .c-hair::after {
        width: 11px;
        height: 38px;
        bottom: -22px;
      }
      .player .ch.j .c-hair::before { left: 6px; }
      .player .ch.j .c-hair::after { right: 6px; }
      .player .ch.andy .c-hair {
        width: 50px;
        height: 36px;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
      }
      .player .ch.andy .c-hair::before,
      .player .ch.andy .c-hair::after {
        width: 12px;
        height: 22px;
        bottom: -10px;
      }
      .player .ch.andy .c-hair::before { left: 4px; }
      .player .ch.andy .c-hair::after { right: 4px; }

      /* Yanzhi 全尺寸球员 */
      .player .ch.yanzhi .c-hair {
        width: 50px;
        height: 14px;
        background: #1a1a1a;
        border-radius: 25px 25px 4px 4px;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }
      .player .ch.yanzhi .c-hair::before {
        content: "";
        position: absolute;
        width: 30px;
        height: 4px;
        background: #6a6a6a;
        border-radius: 2px;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
      }
      .player .ch.yanzhi .c-body {
        background: #37474f;
      }
      .player .ch.yanzhi .c-body::before {
        content: "";
        position: absolute;
        width: 5px;
        height: 14px;
        background: #c62828;
        border-radius: 2px;
        top: -4px;
        left: 50%;
        transform: translateX(-50%);
      }

      .player-name {
        font-size: 13px;
        font-weight: 700;
        color: #1b5e20;
      }

      .player-strokes {
        margin-top: 4px;
        font-size: 22px;
        font-weight: 800;
        color: #4e342e;
        min-height: 30px;
      }

      .player-strokes .label {
        font-size: 10px;
        font-weight: 500;
        color: #78909c;
      }

      /* === 击球按钮 === */
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 22px 0 18px;
      }

      .btn {
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }

      .btn-primary {
        background: #43a047;
        color: #fff;
      }
      .btn-primary:hover:not(:disabled) {
        background: #2e7d32;
      }
      .btn-primary:active:not(:disabled) {
        transform: scale(0.96);
      }
      .btn-primary:disabled {
        background: #a5d6a7;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #eceff1;
        color: #455a64;
      }
      .btn-secondary:hover {
        background: #cfd8dc;
      }

      /* === Yanzhi 屁话气泡 === */
      .speech {
        background: #fff8e1;
        border: 2px solid #c62828;
        border-radius: 14px;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #b71c1c;
        text-align: center;
        margin: 0 auto 14px;
        max-width: 600px;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.3s, transform 0.3s;
        position: relative;
      }
      .speech.show {
        opacity: 1;
        transform: translateY(0);
      }
      .speech::before {
        content: "💼 Yanzhi:";
        display: block;
        font-size: 11px;
        color: #c62828;
        margin-bottom: 4px;
        font-weight: 700;
      }

      /* === 排行榜 === */
      .ranking {
        background: #f1f8e9;
        border-radius: 14px;
        padding: 16px;
        margin-top: 14px;
      }

      .ranking h3 {
        margin: 0 0 12px;
        font-size: 16px;
        color: #1b5e20;
        text-align: center;
      }

      .rank-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        margin-bottom: 6px;
        background: #fff;
        border-radius: 10px;
        font-weight: 600;
      }

      .rank-row .medal {
        font-size: 22px;
        width: 32px;
        text-align: center;
      }

      .rank-row .who {
        flex: 1;
        color: #1b5e20;
      }

      .rank-row .strokes {
        font-size: 18px;
        color: #4e342e;
        font-weight: 800;
      }

      .rank-row.last .who {
        color: #c62828;
      }

      .rank-row.last .strokes {
        color: #c62828;
      }

      /* === 隐藏状态 === */
      .hidden {
        display: none !important;
      }

      @media (max-width: 600px) {
        body {
          padding: 14px;
        }
        .container {
          padding: 22px 14px;
        }
        h1 {
          font-size: 22px;
        }
        .players {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .player .char-svg {
          width: 70px;
          height: 84px;
        }
        .actions {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="back" href="yanzhi.html">← 返回 Yanzhi</a>
        <span style="font-size:11px;color:#78909c">Follow · 和 Yanzhi 打高尔夫</span>
      </div>

      <h1>⛳ 和 Yanzhi 打高尔夫</h1>
      <div class="subtitle">他几乎永远是第四名（按概率）</div>

      <div class="course">
        <div class="hole-flag"></div>
        <div class="players">
          <div class="player" data-id="eamin">
            <div class="char-svg">
              <div class="ch eamin">
                <div class="c-hair"></div>
                <div class="c-face"></div>
                <div class="c-eye left"></div>
                <div class="c-eye right"></div>
                <div class="c-mouth"></div>
                <div class="c-body"></div>
              </div>
            </div>
            <div class="player-name">Eamin</div>
            <div class="player-strokes"><span class="label">杆</span> —</div>
          </div>

          <div class="player" data-id="j">
            <div class="char-svg">
              <div class="ch j">
                <div class="c-hair"></div>
                <div class="c-face"></div>
                <div class="c-eye left"></div>
                <div class="c-eye right"></div>
                <div class="c-mouth"></div>
                <div class="c-body"></div>
              </div>
            </div>
            <div class="player-name">J</div>
            <div class="player-strokes"><span class="label">杆</span> —</div>
          </div>

          <div class="player" data-id="andy">
            <div class="char-svg">
              <div class="ch andy">
                <div class="c-hair"></div>
                <div class="c-face"></div>
                <div class="c-eye left"></div>
                <div class="c-eye right"></div>
                <div class="c-mouth"></div>
                <div class="c-body"></div>
              </div>
            </div>
            <div class="player-name">Andy</div>
            <div class="player-strokes"><span class="label">杆</span> —</div>
          </div>

          <div class="player" data-id="yanzhi">
            <div class="char-svg">
              <div class="ch yanzhi">
                <div class="c-hair"></div>
                <div class="c-face"></div>
                <div class="c-eye left"></div>
                <div class="c-eye right"></div>
                <div class="c-mouth"></div>
                <div class="c-body"></div>
              </div>
            </div>
            <div class="player-name">Yanzhi</div>
            <div class="player-strokes"><span class="label">杆</span> —</div>
          </div>
        </div>
      </div>

      <div id="speech" class="speech"></div>

      <div class="actions">
        <button id="swingBtn" class="btn btn-primary">🏌️ 击球</button>
        <button id="resetBtn" class="btn btn-secondary hidden">🔄 复盘</button>
      </div>

      <div id="ranking" class="ranking hidden">
        <h3>🏆 本轮排名</h3>
        <div id="rankRows"></div>
      </div>
    </div>

    <script src="../assets/voices.js"></script>
    <script>
      const PLAYERS = ["eamin", "j", "andy", "yanzhi"];

      const YANZHI_PHRASES = [
        "打高尔夫要转正",
        "打高尔夫就像工作",
        "打高尔夫也要考核 KPI",
        "高尔夫球场就是职场",
        "我在高尔夫球场上学会了什么叫 OKR",
        "高尔夫和打工一样，前 18 洞是装样子",
        "打高尔夫要正反馈",
        "打高尔夫要 360 评估",
        "这一杆就是我的晋升答辩",
        "果岭上的推杆就是公司的 push",
        "打高尔夫要离职面谈",
        "打高尔夫要 1 on 1",
        "打高尔夫要绩效考核",
        "高尔夫球场的草皮就是员工手册",
        "打高尔夫要正反馈循环",
        "高尔夫球洞就是 OKR 的 O",
        "我在高尔夫球场上被 PUA 了",
        "我挥这一杆的姿势很像在写周报",
        "打高尔夫要算 ROI",
        "我打高尔夫从来不推杆，因为推杆就像 push",
        "高尔夫球场就是职场，前 9 洞是试用期",
      ];

      function generateStrokes(playerId) {
        if (playerId === "yanzhi") {
          // 95% 高杆 (10-15)，5% 偶尔走运
          if (Math.random() < 0.05) {
            return 3 + Math.floor(Math.random() * 5); // 3-7
          }
          return 10 + Math.floor(Math.random() * 6); // 10-15
        }
        // 其余三人：70% 低杆 (1-5)，30% 中杆 (6-9)
        if (Math.random() < 0.7) {
          return 1 + Math.floor(Math.random() * 5); // 1-5
        }
        return 6 + Math.floor(Math.random() * 4); // 6-9
      }

      const swingBtn = document.getElementById("swingBtn");
      const resetBtn = document.getElementById("resetBtn");
      const speechEl = document.getElementById("speech");
      const rankingEl = document.getElementById("ranking");
      const rankRowsEl = document.getElementById("rankRows");

      let results = {};

      function showSpeech(text) {
        speechEl.textContent = text;
        speechEl.classList.remove("show");
        void speechEl.offsetWidth;
        speechEl.classList.add("show");
      }

      function hideSpeech() {
        speechEl.classList.remove("show");
      }

      function speakAs(profile, text, overrides) {
        if (window.OGCVoice) {
          if (overrides) {
            window.OGCVoice.queueSpeak(text, profile, overrides);
          } else {
            window.OGCVoice.queueSpeak(text, profile);
          }
        }
      }

      async function swingAll() {
        if (window.OGCVoice) window.OGCVoice.clearSpeech();
        swingBtn.disabled = true;
        resetBtn.classList.add("hidden");
        rankingEl.classList.add("hidden");
        rankRowsEl.innerHTML = "";
        hideSpeech();
        results = {};

        // 重置显示
        document.querySelectorAll(".player").forEach((p) => {
          p.classList.remove("swinging", "bogey", "birdie");
          p.querySelector(".player-strokes").innerHTML =
            '<span class="label">杆</span> —';
        });

        // 一杆一杆打
        for (let i = 0; i < PLAYERS.length; i++) {
          const id = PLAYERS[i];
          const playerEl = document.querySelector(`.player[data-id="${id}"]`);
          const strokes = generateStrokes(id);
          results[id] = strokes;

          await animate(playerEl, strokes);

          // 实时读数
          const strokesEl = playerEl.querySelector(".player-strokes");
          strokesEl.innerHTML = `<span class="label">杆</span> ${strokes}`;

          if (strokes <= 3) {
            playerEl.classList.add("birdie");
          } else if (strokes >= 9) {
            playerEl.classList.add("bogey");
          }

          // Yanzhi 击球后说一句屁话
          if (id === "yanzhi") {
            const phrase =
              YANZHI_PHRASES[Math.floor(Math.random() * YANZHI_PHRASES.length)];
            showSpeech(phrase);
            speakAs("yanzhi", phrase);
          }
        }

        // 等语音说完再展示排名
        const phraseMs = Math.max(
          900,
          Math.round(results.yanzhi * 280) + 500
        );
        await new Promise((r) => setTimeout(r, phraseMs));

        showRanking();
        speakAs("yanzhi", "好了，复盘一下。本轮我又是第四名");

        swingBtn.disabled = false;
        resetBtn.classList.remove("hidden");
      }

      function animate(playerEl, strokes) {
        return new Promise((resolve) => {
          playerEl.classList.add("swinging");
          const t = Math.max(450, Math.min(900, 300 + strokes * 50));
          setTimeout(() => {
            playerEl.classList.remove("swinging");
            resolve();
          }, t);
        });
      }

      function showRanking() {
        const sorted = PLAYERS.slice().sort(
          (a, b) => results[a] - results[b]
        );
        const medals = ["🥇", "🥈", "🥉", "💀"];
        rankRowsEl.innerHTML = "";
        sorted.forEach((id, idx) => {
          const row = document.createElement("div");
          row.className = "rank-row" + (idx === sorted.length - 1 ? " last" : "");
          const nameMap = { eamin: "Eamin", j: "J", andy: "Andy", yanzhi: "Yanzhi" };
          row.innerHTML = `
            <span class="medal">${medals[idx]}</span>
            <span class="who">${nameMap[id]}</span>
            <span class="strokes">${results[id]} 杆</span>
          `;
          rankRowsEl.appendChild(row);
        });
        rankingEl.classList.remove("hidden");
      }

      function reset() {
        results = {};
        document.querySelectorAll(".player").forEach((p) => {
          p.classList.remove("swinging", "bogey", "birdie");
          p.querySelector(".player-strokes").innerHTML =
            '<span class="label">杆</span> —';
        });
        rankingEl.classList.add("hidden");
        rankRowsEl.innerHTML = "";
        hideSpeech();
        resetBtn.classList.add("hidden");
        if (window.OGCVoice) window.OGCVoice.clearSpeech();
      }

      swingBtn.addEventListener("click", swingAll);
      resetBtn.addEventListener("click", reset);
    </script>
  </body>
</html>
