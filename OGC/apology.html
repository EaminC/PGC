<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OGC · 互相道歉</title>
    <link rel="stylesheet" href="../assets/ogc.css" />
    <link rel="stylesheet" href="../assets/apology.css" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="back" href="index.html">← 返回 OGC</a>
        <span></span>
      </div>

      <h1>🙇 互相道歉</h1>
      <div class="subtitle">看谁是老师眼里的错的人</div>

      <div class="stage" id="stage">
        <!-- Eamin -->
        <div class="char-card" data-id="eamin">
          <div class="card-head">
            <div class="id-block">
              <div class="name">Eamin</div>
              <div class="role">影视大头兵</div>
            </div>
            <div class="mistake">
              <span>错误值</span>
              <span class="num" data-num>0</span>
            </div>
          </div>
          <div class="char-svg">
            <div class="ch eamin">
              <div class="c-hair"></div>
              <div class="c-face"></div>
              <div class="c-eye left"></div>
              <div class="c-eye right"></div>
              <div class="c-mouth"></div>
              <div class="c-body"></div>
            </div>
            <div class="bubble" data-bubble></div>
          </div>
        </div>

        <!-- J -->
        <div class="char-card" data-id="j">
          <div class="card-head">
            <div class="id-block">
              <div class="name">J</div>
              <div class="role">热点大头兵</div>
            </div>
            <div class="mistake">
              <span>错误值</span>
              <span class="num" data-num>0</span>
            </div>
          </div>
          <div class="char-svg">
            <div class="ch j">
              <div class="c-hair"></div>
              <div class="c-face"></div>
              <div class="c-eye left"></div>
              <div class="c-eye right"></div>
              <div class="c-mouth"></div>
              <div class="c-body"></div>
            </div>
            <div class="bubble" data-bubble></div>
          </div>
        </div>

        <!-- Andy -->
        <div class="char-card" data-id="andy">
          <div class="card-head">
            <div class="id-block">
              <div class="name">Andy</div>
              <div class="role">体育大头兵</div>
            </div>
            <div class="mistake">
              <span>错误值</span>
              <span class="num" data-num>0</span>
            </div>
          </div>
          <div class="char-svg">
            <div class="ch andy">
              <div class="c-hair"></div>
              <div class="c-face"></div>
              <div class="c-eye left"></div>
              <div class="c-eye right"></div>
              <div class="c-mouth"></div>
              <div class="c-body"></div>
            </div>
            <div class="bubble" data-bubble></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="start-btn" id="startBtn" type="button">开始</button>
      </div>

      <div class="result" id="result"></div>
    </div>

    <script src="../assets/voices.js"></script>
    <script>
      (function () {
        const members = ["eamin", "j", "andy"];
        const displayNames = { eamin: "Eamin", j: "J", andy: "Andy" };
        const apologies = {
          eamin: "对不起，都是我的错，原谅我好吗",
          j: "抱歉啊，我真的不应该那样做",
          andy: "呜呜，对不起嘛，下次一定改",
        };

        const mistakes = { eamin: 0, j: 0, andy: 0 };
        let running = false;

        // 防御：如果某个 card 找不到，整个游戏都跑不起来，提示一下
        function $(sel) {
          const el = document.querySelector(sel);
          if (!el) console.warn("[apology] 找不到元素:", sel);
          return el;
        }

        const cards = {
          eamin: $('[data-id="eamin"]'),
          j: $('[data-id="j"]'),
          andy: $('[data-id="andy"]'),
        };

        const startBtn = $("#startBtn");
        const resultEl = $("#result");

        function getBubble(id) {
          return cards[id].querySelector("[data-bubble]");
        }

        function setCount(id, n) {
          cards[id].querySelector("[data-num]").textContent = n;
          const m = cards[id].querySelector(".mistake");
          if (!m) return;
          m.classList.remove("pulse");
          void m.offsetWidth;
          m.classList.add("pulse");
        }

        function showBubble(id, text, durationMs) {
          const b = getBubble(id);
          if (!b) return;
          b.textContent = text;
          b.classList.add("show");
          if (durationMs) {
            setTimeout(() => b.classList.remove("show"), durationMs);
          }
        }

        function hideBubble(id) {
          const b = getBubble(id);
          if (!b) return;
          b.classList.remove("show");
        }

        function triggerAnim(id) {
          const card = cards[id];
          if (!card) return;
          const anims = ["shake", "bounce", "wobble", "flash"];
          const a = anims[Math.floor(Math.random() * anims.length)];
          card.classList.remove("shake", "bounce", "wobble", "flash");
          void card.offsetWidth;
          card.classList.add(a);
        }

        function resetAll() {
          members.forEach((id) => {
            mistakes[id] = 0;
            setCount(id, 0);
            hideBubble(id);
          });
          resultEl.classList.remove("show");
          resultEl.innerHTML = "";
        }

        function speak(text, id) {
          if (window.OGCVoice) {
            window.OGCVoice.speak(text, id);
          }
        }

        function pickRandomId() {
          return members[Math.floor(Math.random() * members.length)];
        }

        function startGame() {
          if (running) return;
          running = true;
          startBtn.disabled = true;
          startBtn.textContent = "进行中…";
          resetAll();

          const duration = 5000;
          const tick = 500;
          const startTime = Date.now();
          const handle = setInterval(() => {
            const elapsed = Date.now() - startTime;
            const victim = pickRandomId();
            mistakes[victim] += 1;
            setCount(victim, mistakes[victim]);
            triggerAnim(victim);

            if (elapsed + tick >= duration) {
              clearInterval(handle);
              setTimeout(playApologyPhase, 500);
            }
          }, tick);
        }

        function playApologyPhase() {
          let i = 0;
          function next() {
            if (i >= members.length) {
              setTimeout(showResult, 700);
              return;
            }
            const id = members[i];
            showBubble(id, "道歉中…", 2200);
            speak(apologies[id], id);
            i++;
            setTimeout(next, 2400);
          }
          next();
        }

        function showResult() {
          const sorted = members
            .map((id) => ({ id, n: mistakes[id] }))
            .sort((a, b) => b.n - a.n);
          const worst = sorted[0];
          members.forEach((id) => hideBubble(id));
          resultEl.innerHTML = `错的人是 <span class="big">${displayNames[worst.id]}</span>！`;
          resultEl.classList.add("show");
          speak(`错的人是 ${displayNames[worst.id]}`, worst.id);
          startBtn.disabled = false;
          startBtn.textContent = "再来一次";
          running = false;
        }

        if (startBtn) {
          startBtn.addEventListener("click", startGame);
        }

        // 暴露给调试
        window.__apology = { startGame, speak };
      })();
    </script>
  </body>
</html>
