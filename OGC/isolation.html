<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OGC · 孤立</title>
    <link rel="stylesheet" href="../assets/ogc.css" />
    <link rel="stylesheet" href="../assets/isolation.css" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="back" href="index.html">← 返回 OGC</a>
        <span></span>
      </div>

      <h1>🎲 孤立</h1>
      <div class="subtitle">看谁被孤立</div>

      <div class="stage" id="stage">
        <div class="char-card" data-id="eamin">
          <div class="card-head center">
            <div class="id-block center">
              <div class="name">Eamin</div>
              <div class="role">影视大头兵</div>
            </div>
          </div>
          <div class="char-svg">
            <div class="ch eamin">
              <div class="c-hair"></div>
              <div class="c-face"></div>
              <div class="c-eye left"></div>
              <div class="c-eye right"></div>
              <div class="c-mouth"></div>
              <div class="c-body"></div>
            </div>
          </div>
        </div>

        <div class="char-card" data-id="j">
          <div class="card-head center">
            <div class="id-block center">
              <div class="name">J</div>
              <div class="role">热点大头兵</div>
            </div>
          </div>
          <div class="char-svg">
            <div class="ch j">
              <div class="c-hair"></div>
              <div class="c-face"></div>
              <div class="c-eye left"></div>
              <div class="c-eye right"></div>
              <div class="c-mouth"></div>
              <div class="c-body"></div>
            </div>
          </div>
        </div>

        <div class="char-card" data-id="andy">
          <div class="card-head center">
            <div class="id-block center">
              <div class="name">Andy</div>
              <div class="role">体育大头兵</div>
            </div>
          </div>
          <div class="char-svg">
            <div class="ch andy">
              <div class="c-hair"></div>
              <div class="c-face"></div>
              <div class="c-eye left"></div>
              <div class="c-eye right"></div>
              <div class="c-mouth"></div>
              <div class="c-body"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="dice-wrap">
        <div class="dice face-1" id="dice">
          <div class="dot"></div>
        </div>
      </div>

      <div class="controls">
        <button class="roll-btn" id="rollBtn" type="button">摇骰子</button>
      </div>

      <div class="result" id="result"></div>
    </div>

    <script src="../assets/voices.js"></script>
    <script>
      (function () {
        const members = ["eamin", "j", "andy"];
        const displayNames = { eamin: "Eamin", j: "J", andy: "Andy" };

        // 1-2 → eamin, 3-4 → j, 5-6 → andy
        function rollToId(n) {
          if (n <= 2) return "eamin";
          if (n <= 4) return "j";
          return "andy";
        }

        function $(sel) {
          const el = document.querySelector(sel);
          if (!el) console.warn("[isolation] 找不到元素:", sel);
          return el;
        }

        const cards = {
          eamin: $('[data-id="eamin"]'),
          j: $('[data-id="j"]'),
          andy: $('[data-id="andy"]'),
        };

        const dice = $("#dice");
        const rollBtn = $("#rollBtn");
        const resultEl = $("#result");

        let running = false;

        function setDiceFace(n) {
          dice.className = "dice face-" + n;
          dice.innerHTML = "";
          for (let i = 0; i < n; i++) {
            const d = document.createElement("div");
            d.className = "dot";
            dice.appendChild(d);
          }
        }

        function setNamesOffset(id) {
          const positions = { eamin: -1, j: 0, andy: 1 };
          const target = positions[id];
          members.forEach((mid) => {
            if (mid === id) {
              cards[mid].classList.add("isolated", "sad");
              cards[mid].style.transform = "";
            } else {
              cards[mid].classList.remove("isolated", "sad");
              const dx = positions[mid] - target;
              cards[mid].style.transform = dx === 0 ? "" : `translateX(${-dx * 50}px)`;
            }
          });
        }

        function reset() {
          members.forEach((id) => {
            cards[id].classList.remove("isolated", "sad");
            cards[id].style.transform = "";
          });
          resultEl.classList.remove("show");
          resultEl.innerHTML = "";
          setDiceFace(1);
        }

        function speak(text, id) {
          if (window.OGCVoice) window.OGCVoice.speak(text, id);
        }

        function rollDice() {
          if (running) return;
          running = true;
          rollBtn.disabled = true;
          rollBtn.textContent = "摇骰子中…";
          reset();

          const final = 1 + Math.floor(Math.random() * 6);
          let elapsed = 0;
          const spinDuration = 1800;
          const tickMs = 80;

          dice.classList.add("spin");
          const h = setInterval(() => {
            elapsed += tickMs;
            const fake = 1 + Math.floor(Math.random() * 6);
            setDiceFace(fake);
            if (elapsed >= spinDuration) {
              clearInterval(h);
              dice.classList.remove("spin");
              setTimeout(() => {
                setDiceFace(final);
                const victim = rollToId(final);
                setTimeout(() => {
                  setNamesOffset(victim);
                  setTimeout(() => {
                    showResult(victim);
                  }, 900);
                }, 200);
              }, 50);
            }
          }, tickMs);
        }

        function showResult(victim) {
          resultEl.innerHTML = `被孤立的是 <span class="big">${displayNames[victim]}</span>！`;
          resultEl.classList.add("show");
          speak(`被孤立的是 ${displayNames[victim]}`, victim);
          rollBtn.disabled = false;
          rollBtn.textContent = "再来一次";
          running = false;
        }

        if (rollBtn) {
          rollBtn.addEventListener("click", rollDice);
        }

        // 初始骰子
        setDiceFace(1);

        window.__isolation = { rollDice, speak };
      })();
    </script>
  </body>
</html>
