<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OGC · 孤立</title>
    <link rel="stylesheet" href="../assets/ogc.css" />
    <link rel="stylesheet" href="../assets/isolation.css" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="back" href="index.html">← 返回 OGC</a>
        <span></span>
      </div>

      <h1>🎲 孤立</h1>
      <div class="subtitle">看谁被孤立</div>

      <div class="stage" id="stage">
        <div class="char-card" data-id="eamin">
          <div class="card-head center">
            <div class="id-block center">
              <div class="name">Eamin</div>
              <div class="role">影视大头兵</div>
            </div>
          </div>
          <div class="char-svg">
            <div class="ch eamin">
              <div class="c-hair"></div>
              <div class="c-face"></div>
              <div class="c-eye left"></div>
              <div class="c-eye right"></div>
              <div class="c-mouth"></div>
              <div class="c-body"></div>
            </div>
          </div>
        </div>

        <div class="char-card" data-id="j">
          <div class="card-head center">
            <div class="id-block center">
              <div class="name">J</div>
              <div class="role">热点大头兵</div>
            </div>
          </div>
          <div class="char-svg">
            <div class="ch j">
              <div class="c-hair"></div>
              <div class="c-face"></div>
              <div class="c-eye left"></div>
              <div class="c-eye right"></div>
              <div class="c-mouth"></div>
              <div class="c-body"></div>
            </div>
          </div>
        </div>

        <div class="char-card" data-id="andy">
          <div class="card-head center">
            <div class="id-block center">
              <div class="name">Andy</div>
              <div class="role">体育大头兵</div>
            </div>
          </div>
          <div class="char-svg">
            <div class="ch andy">
              <div class="c-hair"></div>
              <div class="c-face"></div>
              <div class="c-eye left"></div>
              <div class="c-eye right"></div>
              <div class="c-mouth"></div>
              <div class="c-body"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="dice-wrap">
        <div class="dice face-1" id="dice">
          <div class="dot"></div>
        </div>
      </div>

      <div class="controls">
        <button class="roll-btn" id="rollBtn" type="button">摇骰子</button>
      </div>

      <div class="result" id="result"></div>
    </div>

    <script src="../assets/voices.js"></script>
    <script>
      (function () {
        const members = ["eamin", "j", "andy"];
        const displayNames = { eamin: "Eamin", j: "J", andy: "Andy" };

        // 1-2 → eamin, 3-4 → j, 5-6 → andy
        function rollToId(n) {
          if (n <= 2) return "eamin";
          if (n <= 4) return "j";
          return "andy";
        }

        function $(sel) {
          const el = document.querySelector(sel);
          if (!el) console.warn("[isolation] 找不到元素:", sel);
          return el;
        }

        const cards = {
          eamin: $('[data-id="eamin"]'),
          j: $('[data-id="j"]'),
          andy: $('[data-id="andy"]'),
        };

        const dice = $("#dice");
        const rollBtn = $("#rollBtn");
        const resultEl = $("#result");

        let running = false;

        function setDiceFace(n) {
          dice.className = "dice face-" + n;
          dice.innerHTML = "";
          for (let i = 0; i < n; i++) {
            const d = document.createElement("div");
            d.className = "dot";
            dice.appendChild(d);
          }
        }

        function setNamesOffset(id) {
          // 手机上 stage 已经竖排（ogc.css @700px），必须用 translateY
          // 桌面仍是横排，用 translateX
          const isMobile =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(max-width: 700px)").matches;
          const positions = { eamin: -1, j: 0, andy: 1 };
          const target = positions[id];
          const prop = isMobile ? "translateY" : "translateX";
          const amount = isMobile ? 28 : 46;

          members.forEach((mid) => {
            if (mid === id) {
              cards[mid].classList.add("isolated", "sad");
              cards[mid].style.transform = "";
            } else {
              cards[mid].classList.remove("isolated", "sad");
              // 把非受害者推向远离受害者的方向（+dx，原来 -dx 是反的）
              const direction = Math.sign(positions[mid] - target);
              cards[mid].style.transform =
                direction === 0 ? "" : `${prop}(${direction * amount}px)`;
            }
          });
        }

        function reset() {
          members.forEach((id) => {
            cards[id].classList.remove("isolated", "sad");
            cards[id].style.transform = "";
          });
          resultEl.classList.remove("show");
          resultEl.innerHTML = "";
          setDiceFace(1);
        }

        function speak(text, id) {
          if (window.OGCVoice) window.OGCVoice.speak(text, id);
        }

        function queueSpeak(text, id) {
          if (window.OGCVoice) window.OGCVoice.queueSpeak(text, id);
        }

        // 孤立结果播报：
        //   非受害者 → 松口气
        //   受害者   → 抱怨
        //   结果     → 「被孤立的是 X」
        // 用 queueSpeak 排队轮播，避免互相打断
        const RELIEF_LINES = {
          eamin: ["不是我", "好险", "还好不是我"],
          j: ["不是我耶", "好险", "吓死我了"],
          andy: ["不是我", "好耶", "太幸运了"],
        };
        const COMPLAINT_LINES = {
          eamin: ["完了完了", "为什么是我", "又是我"],
          j: ["怎么又是我", "完了", "讨厌"],
          andy: ["为什么孤立我", "又是我", "好惨"],
        };

        function pickLine(map, id) {
          const list = map[id] || [];
          if (!list.length) return "";
          return list[Math.floor(Math.random() * list.length)];
        }

        function announce(victim) {
          // 非受害者先松口气（按数组顺序）
          members.forEach((mid) => {
            if (mid === victim) return;
            queueSpeak(pickLine(RELIEF_LINES, mid), mid);
          });
          // 受害者抱怨
          queueSpeak(pickLine(COMPLAINT_LINES, victim), victim);
          // 最后正式播报
          queueSpeak(`被孤立的是 ${displayNames[victim]}`, victim);
        }

        function rollDice() {
          if (running) return;
          running = true;
          rollBtn.disabled = true;
          rollBtn.textContent = "摇骰子中…";
          // 清掉上一局残留的语音排队
          if (window.OGCVoice) window.OGCVoice.clearSpeech();
          reset();

          const final = 1 + Math.floor(Math.random() * 6);
          let elapsed = 0;
          const spinDuration = 1800;
          const tickMs = 80;

          dice.classList.add("spin");
          const h = setInterval(() => {
            elapsed += tickMs;
            const fake = 1 + Math.floor(Math.random() * 6);
            setDiceFace(fake);
            if (elapsed >= spinDuration) {
              clearInterval(h);
              dice.classList.remove("spin");
              setTimeout(() => {
                setDiceFace(final);
                const victim = rollToId(final);
                setTimeout(() => {
                  setNamesOffset(victim);
                  setTimeout(() => {
                    showResult(victim);
                  }, 900);
                }, 200);
              }, 50);
            }
          }, tickMs);
        }

        function showResult(victim) {
          resultEl.innerHTML = `被孤立的是 <span class="big">${displayNames[victim]}</span>！`;
          resultEl.classList.add("show");
          announce(victim);
          rollBtn.disabled = false;
          rollBtn.textContent = "再来一次";
          running = false;
        }

        if (rollBtn) {
          rollBtn.addEventListener("click", rollDice);
        }

        // 初始骰子
        setDiceFace(1);

        window.__isolation = { rollDice, speak };
      })();
    </script>
  </body>
</html>
